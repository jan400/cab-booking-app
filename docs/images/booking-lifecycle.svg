<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">Cab booking lifecycle</title>
  <desc id="description">A booking request reserves a matching available driver. Completing or cancelling the confirmed booking makes that driver available again.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#718096"/>
    </marker>
    <style>
      .title { font: 700 25px Arial, sans-serif; fill: #18304b; }
      .label { font: 700 17px Arial, sans-serif; fill: #18304b; }
      .detail { font: 14px Arial, sans-serif; fill: #4a5d70; }
      .note { font: 13px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>
  <rect width="1200" height="390" rx="12" fill="#f4f7fa"/>
  <text x="48" y="58" class="title">Booking lifecycle</text>
  <text x="48" y="87" class="detail">Driver availability follows the booking state</text>

  <g fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arrow)">
    <path d="M250 195H302"/>
    <path d="M518 195H570"/>
    <path d="M786 195H838"/>
  </g>

  <g>
    <rect x="44" y="133" width="206" height="124" rx="10" fill="#ffffff" stroke="#b8c8d8" stroke-width="2"/>
    <rect x="44" y="133" width="206" height="8" rx="4" fill="#2a6f97"/>
    <text x="147" y="177" text-anchor="middle" class="label">Booking request</text>
    <text x="147" y="207" text-anchor="middle" class="detail">Customer and vehicle type</text>
    <text x="147" y="231" text-anchor="middle" class="detail">Pickup, drop-off, distance</text>

    <rect x="310" y="133" width="208" height="124" rx="10" fill="#ffffff" stroke="#b8c8d8" stroke-width="2"/>
    <rect x="310" y="133" width="208" height="8" rx="4" fill="#267b65"/>
    <text x="414" y="177" text-anchor="middle" class="label">Driver assigned</text>
    <text x="414" y="207" text-anchor="middle" class="detail">First matching AVAILABLE</text>
    <text x="414" y="231" text-anchor="middle" class="detail">driver is selected</text>

    <rect x="578" y="133" width="208" height="124" rx="10" fill="#ffffff" stroke="#b8c8d8" stroke-width="2"/>
    <rect x="578" y="133" width="208" height="8" rx="4" fill="#e36b35"/>
    <text x="682" y="177" text-anchor="middle" class="label">CONFIRMED</text>
    <text x="682" y="207" text-anchor="middle" class="detail">Fare is calculated</text>
    <text x="682" y="231" text-anchor="middle" class="detail">Driver becomes BUSY</text>

    <rect x="846" y="133" width="310" height="124" rx="10" fill="#ffffff" stroke="#b8c8d8" stroke-width="2"/>
    <rect x="846" y="133" width="310" height="8" rx="4" fill="#55728f"/>
    <text x="1001" y="177" text-anchor="middle" class="label">Complete or cancel</text>
    <text x="1001" y="207" text-anchor="middle" class="detail">Booking reaches a terminal state</text>
    <text x="1001" y="231" text-anchor="middle" class="detail">Driver returns to AVAILABLE</text>
  </g>

  <text x="600" y="319" text-anchor="middle" class="note">A confirmed booking cannot be completed or cancelled more than once.</text>
</svg>