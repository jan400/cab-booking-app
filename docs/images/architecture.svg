<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Cab Booking API architecture</title>
  <desc id="description">HTTP clients call Spring REST controllers, which delegate to services, repositories, and a MySQL database.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#718096"/>
    </marker>
    <style>
      .title { font: 700 25px Arial, sans-serif; fill: #18304b; }
      .label { font: 700 18px Arial, sans-serif; fill: #18304b; }
      .detail { font: 14px Arial, sans-serif; fill: #4a5d70; }
      .flow { font: 12px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>
  <rect width="1200" height="430" rx="12" fill="#f4f7fa"/>
  <text x="48" y="58" class="title">Application architecture</text>
  <text x="48" y="88" class="detail">A layered Spring Boot API backed by MySQL</text>

  <g fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arrow)">
    <path d="M230 220H264"/>
    <path d="M458 220H492"/>
    <path d="M686 220H720"/>
    <path d="M914 220H948"/>
  </g>
  <g class="flow" text-anchor="middle">
    <text x="247" y="202">JSON / HTTP</text>
    <text x="475" y="202">domain calls</text>
    <text x="703" y="202">JPA</text>
    <text x="931" y="202">SQL</text>
  </g>

  <g>
    <rect x="42" y="145" width="188" height="150" rx="10" fill="#ffffff" stroke="#b8c8d8" stroke-width="2"/>
    <rect x="42" y="145" width="188" height="9" rx="5" fill="#2a6f97"/>
    <text x="136" y="190" text-anchor="middle" class="label">API Client</text>
    <text x="136" y="222" text-anchor="middle" class="detail">Postman or HTTP client</text>
    <text x="136" y="248" text-anchor="middle" class="detail">JSON requests</text>

    <rect x="270" y="145" width="188" height="150" rx="10" fill="#ffffff" stroke="#b8c8d8" stroke-width="2"/>
    <rect x="270" y="145" width="188" height="9" rx="5" fill="#267b65"/>
    <text x="364" y="190" text-anchor="middle" class="label">Controllers</text>
    <text x="364" y="222" text-anchor="middle" class="detail">Spring MVC</text>
    <text x="364" y="248" text-anchor="middle" class="detail">Request validation</text>

    <rect x="498" y="145" width="188" height="150" rx="10" fill="#ffffff" stroke="#b8c8d8" stroke-width="2"/>
    <rect x="498" y="145" width="188" height="9" rx="5" fill="#e36b35"/>
    <text x="592" y="190" text-anchor="middle" class="label">Services</text>
    <text x="592" y="222" text-anchor="middle" class="detail">Booking and fare rules</text>
    <text x="592" y="248" text-anchor="middle" class="detail">Driver assignment</text>

    <rect x="726" y="145" width="188" height="150" rx="10" fill="#ffffff" stroke="#b8c8d8" stroke-width="2"/>
    <rect x="726" y="145" width="188" height="9" rx="5" fill="#55728f"/>
    <text x="820" y="190" text-anchor="middle" class="label">Repositories</text>
    <text x="820" y="222" text-anchor="middle" class="detail">Spring Data JPA</text>
    <text x="820" y="248" text-anchor="middle" class="detail">Hibernate ORM</text>

    <rect x="954" y="145" width="204" height="150" rx="10" fill="#ffffff" stroke="#b8c8d8" stroke-width="2"/>
    <rect x="954" y="145" width="204" height="9" rx="5" fill="#4479a1"/>
    <text x="1056" y="190" text-anchor="middle" class="label">MySQL</text>
    <text x="1056" y="222" text-anchor="middle" class="detail">Customers</text>
    <text x="1056" y="248" text-anchor="middle" class="detail">Drivers and bookings</text>
  </g>

  <rect x="42" y="340" width="1116" height="48" rx="8" fill="#e8eef4"/>
  <text x="600" y="370" text-anchor="middle" class="detail">Domain entities: Customer  |  Driver  |  Booking</text>
</svg>